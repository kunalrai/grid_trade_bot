# fly.toml app configuration file
# See https://fly.io/docs/reference/configuration/ for information

app = "grid-trading-bot"
primary_region = "sin"  # Singapore - change to your preferred region

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Important: Prevent auto-sleep
  auto_start_machines = true
  min_machines_running = 1    # Keep at least 1 machine running

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
